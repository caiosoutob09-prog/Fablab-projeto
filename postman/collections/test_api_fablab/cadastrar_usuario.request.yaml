$kind: http-request
description: |-
  Registers a new user in the FabLab system.

  **Method:** POST  
  **Endpoint:** `/api/cadastrar_usuario`

  ## Request Body (JSON)

  | Field | Type | Description |
  | --- | --- | --- |
  | nome | string | Full name of the user |
  | email | string | User's email address |
  | senha | string | User's password |
  | turma | string | Class/group the user belongs to |
  | nivel | string | User's level (e.g. "2" for level 2) |

  ## Responses

  | Status | Description |
  | --- | --- |
  | 201 | User registered successfully |
  | 4xx | Validation or conflict error |

  ## Example Response (201)

  ``` json
  {
    "message": "Usuário cadastrado com sucesso",
    "error": "n"
  }

   ```
